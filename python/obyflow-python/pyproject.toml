[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obyflow-python"
version = "1.1.2"
description = "Obyflow Python SDK — canonical event emission and local storage for the Obyflow observability platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "fastapi>=0.110",
  "starlette>=0.37",
  "httpx>=0.27",
  "werkzeug>=3",
  "langchain-core>=0.2",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]
langchain = [
  "langchain-core>=0.2",
]
analysis = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["obyflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/Obyflow/obyflow"
Repository = "https://github.com/Obyflow/obyflow"
Issues = "https://github.com/Obyflow/obyflow/issues"
